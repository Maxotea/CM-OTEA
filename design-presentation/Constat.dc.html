    <span style="color: #C88B52;">01</span>

    <div>
        <h1 style="margin: 0 0 34px; font-family: 'Bodoni Moda', Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 58px; line-height: 1.08; letter-spacing: -0.01em; color: #F0E9DE; text-wrap: pretty;">Vous savez qu’il faut poster.</h1>
      <p style="margin: 0 0 32px; font-size: 25px; font-weight: 300; line-height: 1.5; color: #F0E9DE;">Vous savez aussi que vous ne le ferez pas cette semaine.<br>Ni la semaine prochaine.</p>
      <p style="margin: 0; font-size: 19px; font-weight: 300; line-height: 1.65; color: #9E9488; max-width: 520px; text-wrap: pretty;">Ce n’est pas un manque de volonté. C’est qu’un compte qui tient demande une heure par jour, tous les jours, et que cette heure vous ne l’avez pas.</p>
    </div>
    <div style="height: 100%; display: flex; align-items: center; justify-content: center;">
