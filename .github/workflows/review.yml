name: Review hebdo client

# Le fichier Excel de validation hebdomadaire, dans les deux sens :
#   - generer (vendredi matin) : lit les brouillons de la SEMAINE SUIVANTE dans Metricool
#     (et de celle d'après pour un compte à semaines_avance: 2, voir reviews/config.json)
#     et écrit un fichier par client et par semaine dans reviews/a-envoyer/ — la routine Claude du
#     vendredi le dépose ensuite dans le dossier Drive permanent du client (l'ancien passe
#     en Archives) et met reviews/config.json à jour ; le mail part le lundi matin ;
#   - appliquer (3 fois par jour) : relit chaque fichier par son export public, pousse les
#     corrections du client dans Metricool et passe les lignes ✅ en publication automatique.
# Tourne ici et pas dans une session Claude : la politique réseau des sessions distantes
# bloque app.metricool.com et les exports Drive, un runner Actions ne les bloque pas.

on:
  schedule:
    # Vendredi 5h00 UTC (7h00 à Paris en heure d'été) : après l'action « Carrousels
    # hebdo » de 4h30, pour que le carrousel du mercredi suivant figure dans le fichier
    # envoyé au client. La cible est le lundi SUIVANT (voir l'étape « Déterminer la
    # semaine visée ») ; la routine Claude du vendredi (6h00 UTC) dépose ensuite les
    # fichiers dans les dossiers Drive permanents.
    - cron: "0 5 * * 5"
    # Trois relèves par jour (6h30, 12h30, 18h30 à Paris en heure d'été) : une validation
    # du soir est appliquée avant le créneau de 9h00 du lendemain, une validation du matin
    # avant le post de 18h00.
    - cron: "30 4,10,16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire"
        type: choice
        options: [generer, appliquer]
        required: true
      semaine:
        description: "generer : lundi visé (YYYY-MM-DD). Vide = semaine en cours."
        required: false
      client:
        description: "Un seul compte (ex. le-loft). Vide = tous les comptes actifs."
        required: false
      dry_run:
        description: "Montrer ce qui serait fait, sans rien écrire nulle part"
        type: boolean
        default: false

# Les deux jobs commitent dans le dépôt : on les sérialise pour éviter les pushs concurrents.
concurrency: review-hebdo

permissions:
  contents: write

jobs:
  generer:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'generer') ||
      github.event.schedule == '0 5 * * 5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      # Planifié (vendredi) : --a-venir, soit le lundi SUIVANT, plus les semaines d'après
      # pour les comptes à semaines_avance > 1. Lancé à la main : la semaine demandée, ou
      # la semaine en cours si le champ est vide.
      - name: Déterminer la semaine visée
        id: semaine
        run: |
          if [ -n "${{ inputs.semaine }}" ]; then
            echo "arg=--semaine ${{ inputs.semaine }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "arg=--a-venir" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Générer les fichiers de la semaine
        env:
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
        run: |
          python3 scripts/review.py generer \
            ${{ steps.semaine.outputs.arg }} \
            ${{ inputs.client && format('--client {0}', inputs.client) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commiter les fichiers générés
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- reviews/ && [ -z "$(git status --porcelain reviews/)" ]; then
            echo "Aucun fichier généré — rien à commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/
          git commit \
            -m "Génère les fichiers de review de la semaine" \
            -m "À déposer dans le dossier Drive permanent de chaque client (routine Claude du vendredi), qui note leur identifiant dans reviews/config.json."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Conserver les fichiers en artefact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: reviews-a-envoyer
          path: reviews/a-envoyer/
          retention-days: 30

  appliquer:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'appliquer') ||
      github.event.schedule == '30 4,10,16 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Appliquer les décisions clients
        env:
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
        run: |
          python3 scripts/review.py appliquer \
            ${{ inputs.client && format('--client {0}', inputs.client) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commiter le journal des décisions
        if: ${{ always() && !inputs.dry_run }}
        run: |
          if git diff --quiet -- reviews/etat/ && [ -z "$(git status --porcelain reviews/etat/)" ]; then
            echo "Aucune décision nouvelle — rien à commiter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/etat/
          git commit \
            -m "Applique les décisions de la review client" \
            -m "Journal par compte dans reviews/etat/ — matière du récap du lundi."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
