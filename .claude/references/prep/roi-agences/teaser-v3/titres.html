<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Motion R.O.I.</title>
<!-- Couche motion design du teaser v3, fond transparent, pilotée par seek(t).
     titres.html          : graphismes, fonds noirs et rouges, textes
     titres.html?masque   : uniquement les textes « fenêtres » (blanc), par où passe la vidéo -->
<style>
@font-face{font-family:Caladea;src:url(../teaser-src/fonts/caladea-700-normal.woff2);font-weight:700}
@font-face{font-family:Caladea;src:url(../teaser-src/fonts/caladea-400-italic.woff2);font-weight:400;font-style:italic}
@font-face{font-family:Carlito;src:url(../teaser-src/fonts/carlito-700-normal.woff2);font-weight:700}
@font-face{font-family:Carlito;src:url(../teaser-src/fonts/carlito-400-normal.woff2);font-weight:400}
:root{--red:#DC2626;--noir:#0A0A0A;--soft:#E5E5E5}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
.g{position:absolute;inset:0;visibility:hidden}
.bg-black{background:var(--noir)} .bg-red{background:var(--red)}
.t{position:absolute;left:0;width:1920px;text-align:center;white-space:nowrap;color:#fff;transform-origin:50% 50%}
.over .t{text-shadow:0 6px 40px rgba(0,0,0,.6)}
.m{position:absolute;left:0;width:1920px;overflow:hidden;padding-bottom:.15em}
.m>.t{position:relative}
.big{font-family:Caladea;font-weight:700;text-transform:uppercase;line-height:.9;letter-spacing:-.01em}
.serif{font-family:Caladea;font-weight:700;line-height:1}
.it{font-family:Caladea;font-style:italic;font-weight:400;line-height:1.05}
.sans{font-family:Carlito;font-weight:700}
.eb{font-family:Carlito;font-weight:700;text-transform:uppercase;letter-spacing:.34em;padding-left:.34em;font-size:40px;color:var(--red)}
.bg-red .eb{color:var(--noir)}
.over .eb{text-shadow:0 2px 18px rgba(0,0,0,.9)}
.noir{color:var(--noir)!important} .red{color:var(--red)} .soft{color:var(--soft)}
.scrim{position:absolute;inset:0;background:radial-gradient(ellipse 75% 65% at 50% 50%,rgba(0,0,0,.45),rgba(0,0,0,0) 75%)}
.scrim.bas{background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,0) 55%)}
.barre{position:absolute;left:0;top:0;width:14px;height:1080px;background:var(--red)}
body.masque .g{background:none!important}
body.masque .t{color:#fff!important;text-shadow:none!important}
svg{position:absolute;left:0;top:0}
</style></head>
<body>
<script>
const T = 60 / 138;
// Groupes : [début, fin (en temps), fond ('black' | 'red' | '' = sur la vidéo), masque ?, éléments]
// élément : [html, classes, style, animation, décalage en temps]
const NBSP = ' ', FINE = ' ';
const G = [
  [0, 2, 'black', 0, [['10' + FINE + '000', 'big', 'top:340px;font-size:380px', 'slam', 0]]],
  [2, 4, '', 0, [['entrepreneurs', 'sans', 'top:470px;font-size:96px;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase', 'rise', 0]]],
  [4, 5, 'red', 0, [['Une ligne', 'big noir', 'top:400px;font-size:250px', 'slam', 0]]],
  [5, 6, 'black', 0, [['de départ<span class="red">.</span>', 'big', 'top:400px;font-size:250px', 'slam', 0]]],
  [8, 10, '', 0, [['Course professionnelle au cœur de', 'eb', 'top:290px', 'fade', 0]]],
  [8, 10, 'black', 1, [['La Défense', 'big', 'top:350px;font-size:330px', 'slam', 0]]],
  [12, 13, 'black', 0, [['5' + NBSP + 'km', 'big', 'top:330px;font-size:420px', 'slam', 0]]],
  [13, 14, 'red', 0, [['10' + NBSP + 'km', 'big noir', 'top:330px;font-size:420px', 'slam', 0]]],
  [16, 18, 'black', 0, [['', 'route', '', 'route', 0]]],
  [20, 21, 'black', 0, [['Automne', 'big', 'top:370px;font-size:320px', 'slam', 0]]],
  [21, 22, 'red', 0, [['2027', 'big noir', 'top:300px;font-size:460px', 'slam', 0]]],
  [24.5, 25, 'black', 0, [['R.', 'big', 'top:200px;font-size:700px', 'cut', 0]]],
  [25.5, 26, 'black', 0, [['O.', 'big', 'top:200px;font-size:700px', 'cut', 0]]],
  [26.5, 27, 'black', 0, [['I.', 'big red', 'top:200px;font-size:700px', 'cut', 0]]],
  [28, 28.6, '', 0, [['R.O.I.', 'big', 'top:300px;font-size:420px', 'slam', 0]]],
  [28.6, 30, 'black', 0, [['Run on Investment', 'eb', 'top:420px', 'fade', 0], ['À vos marques<span class="red">.</span>', 'serif', 'top:490px;font-size:130px', 'rise', 0.3]]],
  [31, 32, '', 0, [['Prêts' + FINE + '?', 'big', 'top:380px;font-size:280px', 'slam', 0]]],
  [32, 32.5, 'red', 0, [['Partez.', 'big noir', 'top:350px;font-size:380px', 'cut', 0]]],
  [36, 38, '', 0, [['Arrivée à la', 'eb', 'top:390px', 'fade', 0], ['Plénitude Arena', 'big', 'top:450px;font-size:190px', 'slam', 0.25]]],
  [40, 41, 'black', 0, [['Le networking', 'big', 'top:400px;font-size:230px', 'slam', 0]]],
  [41, 42, 'red', 0, [['commence', 'big noir', 'top:380px;font-size:300px', 'slam', 0]]],
  [42, 44, '', 0, [['à la ligne d’arrivée.', 'it', 'top:790px;font-size:140px', 'rise', 0]], 'bas'],
  [46, 48, 'black', 0, [['Objectif', 'eb', 'top:270px', 'fade', 0], ['10' + FINE + '000', 'big', 'top:330px;font-size:380px', 'count', 0.2]]],
  [48, 50, 'black', 1, [['10' + FINE + '000', 'big', 'top:250px;font-size:480px', 'hold', 0]]],
  [48, 50, '', 0, [['Première édition', 'eb', 'top:200px', 'fade', 0], ['participants', 'serif', 'top:770px;font-size:120px', 'rise', 0.5]]],
  [50, 50.5, 'black', 0, [['entrepreneurs', 'big', 'top:420px;font-size:200px', 'cut', 0]]],
  [50.5, 51, 'red', 0, [['dirigeants', 'big noir', 'top:410px;font-size:230px', 'cut', 0]]],
  [51, 51.5, 'black', 0, [['cadres', 'big', 'top:380px;font-size:300px', 'cut', 0]]],
  [51.5, 52, 'red', 0, [['indépendants', 'big noir', 'top:420px;font-size:200px', 'cut', 0]]],
  [56, 57, 'black', 0, [['Nous cherchons', 'big', 'top:410px;font-size:200px', 'slam', 0]]],
  [57, 58, 'red', 0, [['l’agence', 'big noir', 'top:360px;font-size:330px', 'slam', 0]]],
  [58, 59, '', 0, [['qui va l’écrire', 'big', 'top:410px;font-size:190px', 'slam', 0]]],
  [59, 60, 'black', 0, [['avec nous<span class="red">.</span>', 'big', 'top:380px;font-size:270px', 'slam', 0]]],
  [60, 62, 'black', 0, [['On cherche', 'eb', 'top:300px', 'fade', 0], ['Mandataire unique', 'serif', 'top:370px;font-size:100px', 'rise', 0], ['Groupement', 'serif', 'top:490px;font-size:100px', 'rise', 0.5], ['Assistance à maîtrise d’ouvrage', 'serif', 'top:610px;font-size:100px', 'rise', 1]]],
  [64, 65, 'black', 0, [['Il y a un', 'big', 'top:380px;font-size:280px', 'slam', 0]]],
  [65, 66, 'black', 0, [['dernier élément<span class="red">.</span>', 'big', 'top:420px;font-size:200px', 'slam', 0]]],
  [66, 68, '', 0, [['On vous le présente', 'serif', 'top:450px;font-size:140px', 'rise', 0]]],
  [68, 70, 'red', 0, [['en visio.', 'it noir', 'top:330px;font-size:320px', 'slam', 0]]],
  [76, 78, '', 0, [['La Défense', 'big', 'top:400px;font-size:250px', 'slam', 0]]],
  [78, 80, '', 0, [['5 <span class="red">·</span> 10' + NBSP + 'km', 'big', 'top:400px;font-size:250px', 'slam', 0]]],
  [80, 82, '', 0, [['10' + FINE + '000', 'big', 'top:380px;font-size:300px', 'slam', 0]]],
  [82, 84, '', 0, [['Automne 2027', 'big red', 'top:400px;font-size:240px', 'slam', 0]]],
  [84, 999, 'black', 0, [
    ['R.O.I.', 'serif', 'top:150px;font-size:260px;letter-spacing:-.02em', 'slam', 0],
    ['RUN ON INVESTMENT', 'sans', 'top:430px;font-size:42px;letter-spacing:.42em;padding-left:.42em;color:var(--red)', 'fade', 1],
    ['la course qui connecte les entrepreneurs', 'it soft', 'top:500px;font-size:54px', 'fade', 2],
    ['On en parle <span class="red">30' + NBSP + 'minutes</span>' + FINE + '?', 'serif', 'top:665px;font-size:88px', 'rise', 4],
    ['Maxime Dietrich <span class="red">·</span> 07' + NBSP + '79' + NBSP + '97' + NBSP + '19' + NBSP + '61', 'sans', 'top:815px;font-size:44px;letter-spacing:.06em', 'fade', 6]], 'barre'],
];

const MASQUE = location.search.includes('masque');
if (MASQUE) document.body.classList.add('masque');
const clamp = (x) => Math.min(1, Math.max(0, x));
const outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const groups = [];
for (const [a, b, bg, masque, items, extra] of G) {
  if (MASQUE !== !!masque) continue;          // passe masque : seulement les textes fenêtres
  const g = document.createElement('div');
  g.className = 'g' + (bg && !MASQUE ? ' bg-' + bg : '') + (bg ? '' : ' over');
  if (!bg) g.innerHTML = `<div class="scrim ${extra === 'bas' ? 'bas' : ''}"></div>`;
  if (extra === 'barre') g.innerHTML += '<div class="barre"></div>';
  const its = [];
  for (const [html, cls, style, x, d] of items) {
    if (x === 'route') { its.push({ x, route: buildRoute(g), d: d * T }); continue; }
    let n = document.createElement('div'); n.className = 't ' + cls; n.style.cssText = style; n.innerHTML = html;
    if (x === 'rise') { const m = document.createElement('div'); m.className = 'm'; m.style.top = n.style.top; n.style.top = '0'; m.appendChild(n); g.appendChild(m); }
    else g.appendChild(n);
    its.push({ n, x, d: d * T, html });
  }
  document.body.appendChild(g);
  groups.push({ g, a: a * T, b: b * T, its });
}

function buildRoute(g) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('width', 1920); svg.setAttribute('height', 1080);
  svg.innerHTML = `
    <ellipse cx="1500" cy="560" rx="230" ry="120" fill="none" stroke="#2A2A2A" stroke-width="4"/>
    <ellipse cx="1500" cy="560" rx="160" ry="78" fill="none" stroke="#2A2A2A" stroke-width="4"/>
    <path id="trace" d="M330 760 C 560 760, 600 380, 860 430 S 1180 760, 1500 560" fill="none" stroke="#DC2626" stroke-width="12" stroke-linecap="round"/>
    <circle id="pt" r="16" fill="#DC2626"/><circle id="halo" r="30" fill="none" stroke="#DC2626" stroke-width="4"/>
    <circle cx="330" cy="760" r="10" fill="#fff"/>
    <text x="330" y="830" fill="#fff" font-family="Carlito" font-weight="700" font-size="36" letter-spacing="10" text-anchor="middle">LA DÉFENSE</text>
    <text id="lbA" x="1500" y="740" fill="#DC2626" font-family="Carlito" font-weight="700" font-size="36" letter-spacing="10" text-anchor="middle">PLÉNITUDE ARENA</text>
    <text id="lbK" x="960" y="200" fill="#fff" font-family="Caladea" font-weight="700" font-size="120" text-anchor="middle">5 ET 10 KM</text>`;
  g.appendChild(svg);
  const p = svg.querySelector('#trace'); const L = p.getTotalLength();
  p.style.strokeDasharray = L;
  return { p, L, pt: svg.querySelector('#pt'), halo: svg.querySelector('#halo'), lbA: svg.querySelector('#lbA'), lbK: svg.querySelector('#lbK') };
}

window.DURATION = 97 * T;
window.seek = function (t) {
  for (const G of groups) {
    const on = t >= G.a - 1e-6 && t < G.b - 1e-6;
    G.g.style.visibility = on ? 'visible' : 'hidden';
    if (!on) continue;
    const life = clamp((t - G.a) / (G.b - G.a));
    for (const it of G.its) {
      const lt = t - G.a - it.d;
      if (it.x === 'route') {
        const r = it.route, k = inOut(clamp(lt / (1.5 * 0.87)));
        r.p.style.strokeDashoffset = r.L * (1 - k);
        const q = r.p.getPointAtLength(r.L * k);
        r.pt.setAttribute('cx', q.x); r.pt.setAttribute('cy', q.y);
        r.halo.setAttribute('cx', q.x); r.halo.setAttribute('cy', q.y);
        r.halo.setAttribute('r', 22 + 14 * Math.abs(Math.sin(lt * 7)));
        r.lbA.style.opacity = clamp((k - 0.85) / 0.15);
        r.lbK.style.opacity = outCubic(clamp(lt / 0.3));
        continue;
      }
      const s = it.n.style;
      if (lt < 0) { s.opacity = 0; continue; }
      if (it.x === 'slam') {
        const p = outExpo(clamp(lt / 0.16));
        s.opacity = clamp(lt / 0.04);
        s.transform = `scale(${((1.35 - 0.35 * p) * (1 + 0.04 * life)).toFixed(4)})`;
        s.filter = p < 0.98 ? `blur(${((1 - p) * 16).toFixed(2)}px)` : 'none';
      } else if (it.x === 'cut') {
        s.opacity = 1;
        s.transform = `scale(${(1.06 - 0.06 * outExpo(clamp(lt / 0.12)) + 0.03 * life).toFixed(4)})`;
      } else if (it.x === 'hold') {
        s.opacity = 1;
        s.transform = `scale(${(1 + 0.06 * life).toFixed(4)})`;
      } else if (it.x === 'rise') {
        s.opacity = 1;
        s.transform = `translateY(${((1 - outExpo(clamp(lt / 0.5))) * 115).toFixed(2)}%)`;
      } else if (it.x === 'fade') {
        s.opacity = outCubic(clamp(lt / 0.3));
        s.transform = `translateY(${((1 - outCubic(clamp(lt / 0.45))) * 18).toFixed(2)}px)`;
      } else if (it.x === 'count') {
        const p = outExpo(clamp(lt / 0.75));
        const v = Math.round(10000 * p / 10) * 10;
        it.n.textContent = v >= 1000 ? Math.floor(v / 1000) + FINE + String(v % 1000).padStart(3, '0') : String(v);
        s.opacity = 1;
        s.transform = `scale(${(1 + 0.04 * life).toFixed(4)})`;
      }
    }
  }
};
window.ready = document.fonts.ready.then(() => { window.seek(0); return true; });
</script>
</body></html>
