<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>R.O.I. wordmark</title>
<link rel="stylesheet" href="fonts.css">
<style>
  html,body{margin:0;background:transparent}
  .logo{display:inline-block;padding:40px 60px;text-align:left}
  .w{font-family:'Caladea',serif;font-weight:700;font-size:300px;line-height:.9;letter-spacing:-.02em;color:#FFFFFF;margin:0}
  .s{font-family:'Carlito',sans-serif;font-weight:700;font-size:44px;letter-spacing:.42em;color:#DC2626;margin:26px 0 0}
  .dark .w{color:#0A0A0A}
</style>
</head>
<body>
  <div class="logo" id="light"><p class="w">R.O.I.</p><p class="s">RUN ON INVESTMENT</p></div>
  <div class="logo dark" id="dark"><p class="w">R.O.I.</p><p class="s">RUN ON INVESTMENT</p></div>
</body>
</html>
